# Local development configuration. Do not use anonymous access in production.
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Enables WebSocket clients if a dashboard is added later.
listener 9001
protocol websockets
allow_anonymous true
